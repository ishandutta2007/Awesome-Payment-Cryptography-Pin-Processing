<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #cbd5e1; }
    .tag { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    .pulse-circle { animation: pulse 3s infinite ease-in-out; transform-origin: center; }
    .dash-line { stroke-dasharray: 8 6; animation: dash 20s linear infinite; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.08); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.4; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
  </style>

  <!-- Base Layer -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />

  <!-- Dynamic Background Animation Elements (Kept safely in background) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="180" fill="#6366f1" filter="blur(60px)" class="pulse-circle" />
    <circle cx="1050" cy="260" r="160" fill="#ec4899" filter="blur(60px)" class="pulse-circle" />
    <!-- Dynamic Cryptographic Data Flow Lines -->
    <path d="M -50 280 Q 300 320 600 240 T 1250 280" fill="none" stroke="#6366f1" stroke-width="2" class="dash-line" />
    <path d="M -50 60 Q 400 100 800 40 T 1250 100" fill="none" stroke="#a855f7" stroke-width="1.5" class="dash-line" />
  </g>

  <!-- Interactive Graphic Illustration (Right Side) -->
  <g transform="translate(820, 50)">
    <!-- HSM Security Chip Frame -->
    <rect x="40" y="30" width="260" height="180" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />
    
    <!-- Shield Icon & Lock -->
    <path d="M 170 60 L 220 85 V 130 C 220 160 170 180 170 180 C 170 180 120 160 120 130 V 85 L 170 60 Z" fill="none" stroke="url(#primaryGlow)" stroke-width="3" filter="url(#glow)" />
    <circle cx="170" cy="115" r="12" fill="#38bdf8" />
    <path d="M 170 127 V 142" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    
    <!-- Code / Cipher Matrix Bits -->
    <rect x="60" y="60" width="45" height="24" rx="6" fill="#334155" opacity="0.8" />
    <text x="82" y="76" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">TR-31</text>
    
    <rect x="60" y="95" width="45" height="24" rx="6" fill="#334155" opacity="0.8" />
    <text x="82" y="111" font-family="monospace" font-size="11" fill="#a855f7" text-anchor="middle">DUKPT</text>

    <rect x="60" y="130" width="45" height="24" rx="6" fill="#334155" opacity="0.8" />
    <text x="82" y="146" font-family="monospace" font-size="11" fill="#ec4899" text-anchor="middle">ISO-4</text>
  </g>

  <!-- Main Content Foreground (Guaranteed Visibility & Foreground Priority) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 55)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
      <text x="140" y="20" class="tag" text-anchor="middle">🔒 PAYMENT CRYPTOGRAPHY &amp; HSM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" class="title">Payment Cryptography</text>
    <text x="0" y="188" class="title" fill="url(#primaryGlow)">&amp; PIN Processing</text>

    <!-- Subtitle -->
    <text x="0" y="235" class="subtitle">Curated directory of Payment HSMs, PIN Translation, ISO 9564, TR-31 &amp; EMV Libraries</text>

    <!-- Bottom Feature Chips -->
    <g transform="translate(0, 265)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="65" y="18" font-family="system-ui" font-size="12" fill="#94a3b8" text-anchor="middle">PCI PIN &amp; P2PE</text>

      <!-- Chip 2 -->
      <rect x="140" y="0" width="140" height="28" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="210" y="18" font-family="system-ui" font-size="12" fill="#94a3b8" text-anchor="middle">ANSI X9.24 DUKPT</text>

      <!-- Chip 3 -->
      <rect x="290" y="0" width="140" height="28" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="360" y="18" font-family="system-ui" font-size="12" fill="#94a3b8" text-anchor="middle">ISO 8583 Switches</text>

      <!-- Chip 4 -->
      <rect x="440" y="0" width="140" height="28" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="510" y="18" font-family="system-ui" font-size="12" fill="#94a3b8" text-anchor="middle">Open-Source &amp; SaaS</text>
    </g>
  </g>
</svg>
